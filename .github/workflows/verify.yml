name: Verify

on:
  pull_request:
    types: [opened, synchronize]
    branches: main

jobs:
  verify-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: giancosta86/aurora-github/actions/verify-elvish-package@v11

  verify-github-actions:
    runs-on: ubuntu-24.04
    needs:
      - verify-library
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/test-actions/test-install-elvish-packages

  verify:
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - verify-library
      - verify-github-actions
    steps:
      - uses: actions/checkout@v7
      - uses: giancosta86/aurora-github/actions/check-required-jobs@v11
        with:
          needs-as-json: ${{ toJSON(needs) }}
