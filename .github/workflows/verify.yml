name: Verify

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: main

  workflow_dispatch:

jobs:
  verify-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - shell: bash
        run: curl -so - https://dl.elv.sh/linux-amd64/elvish-v0.21.0.tar.gz | tar -xzC /usr/local/bin

      - shell: bash
        run: |
          elvish verify.elv

  verify-github-action:
    runs-on: ubuntu-24.04
    needs:
      - verify-library
    steps:
      - uses: actions/checkout@v7

      - shell: bash
        run: curl -so - https://dl.elv.sh/linux-amd64/elvish-v0.21.0.tar.gz | tar -xzC /usr/local/bin

      - uses: ./.github/test-actions/test-install-elvish-packages

  verify:
    runs-on: ubuntu-24.04
    needs:
      - verify-github-action

    steps:
      - shell: bash
        run: echo '✅ All tests OK!'
