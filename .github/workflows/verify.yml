name: Verify

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: main

  workflow_dispatch:

jobs:
  verify-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: elves/setup-elvish@v1
        with:
          elvish-version: 0.21.0

      - shell: bash
        run: |
          elvish verify.elv

  verify-github-action:
    runs-on: ubuntu-24.04
    needs:
      - verify-library
    steps:
      - uses: actions/checkout@v7

      - uses: elves/setup-elvish@v1
        with:
          elvish-version: 0.21.0

      - uses: ./.github/test-actions/test-install-elvish-packages

  verify:
    runs-on: ubuntu-24.04
    needs:
      - verify-github-action

    steps:
      - shell: bash
        run: |
          echo '✅ All tests OK!'
